name: Windows acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-acceptance:
    name: Windows P1–P5 / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt playwright
          python -m playwright install chromium
      - name: Unit and integration tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/js/p4_core.test.mjs tests/js/p5_quality.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Browser and packaging acceptance
        shell: pwsh
        run: |
          python tests/e2e_p4.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/e2e_p5.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate-package.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_p4.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_p5.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-editor-evidence-py${{ matrix.python-version }}
          path: examples/editor/*.png
